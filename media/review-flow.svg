<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="188" viewBox="0 0 1000 188" role="img" aria-label="ReviewSlate 工作流程"><rect width="1000" height="188" rx="16" fill="#F7F5FF"/><rect x="24" y="26" width="176" height="94" rx="12" fill="#E8EDFF"/><text x="112" y="67" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3557B8">固定基点</text><text x="112" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3557B8">选择分支或提交</text><path d="M204 73h12m-4 -4 4 4-4 4" fill="none" stroke="#7663AF" stroke-width="2"/><rect x="218" y="26" width="176" height="94" rx="12" fill="#EAE3FA"/><text x="306" y="67" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#6244A6">记录意见</text><text x="306" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6244A6">文件、目录、选区</text><path d="M398 73h12m-4 -4 4 4-4 4" fill="none" stroke="#7663AF" stroke-width="2"/><rect x="412" y="26" width="176" height="94" rx="12" fill="#E0F2EF"/><text x="500" y="67" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#257567">交给 Agent</text><text x="500" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#257567">复制本地交接说明</text><path d="M592 73h12m-4 -4 4 4-4 4" fill="none" stroke="#7663AF" stroke-width="2"/><rect x="606" y="26" width="176" height="94" rx="12" fill="#FFF0D7"/><text x="694" y="67" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#956319">修改与回复</text><text x="694" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#956319">Agent 读取完整评论</text><path d="M786 73h12m-4 -4 4 4-4 4" fill="none" stroke="#7663AF" stroke-width="2"/><rect x="800" y="26" width="176" height="94" rx="12" fill="#E3F1E4"/><text x="888" y="67" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#357442">人工复核</text><text x="888" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#357442">确认后解决评论</text><text x="500" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6244A6">内容变化后，继续审阅</text></svg>
